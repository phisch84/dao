# This workflow builds all modules and runs their tests with Maven on every push and pull request
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # required to download test-utils from GitHub Packages

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the repositories/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # compiles against the Java 8 API (maven.compiler.release; dao-h-jakarta: Java 17) and runs all tests;
    # install (into the runner's local repository only), so that the next step finds the modules
    - name: Build and test with Maven
      run: mvn -B -ntp install -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # runs the tests of dao-h-jakarta, built with Hibernate 7, with the oldest supported Hibernate version, without compiling again
    - name: Test dao-h-jakarta with Hibernate 6.6
      run: mvn -B -ntp -pl dao-h-jakarta -P hibernate-6.6 surefire:test -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
